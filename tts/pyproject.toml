[project]
name = "tts"
version = "0.1.0"
description = "Shared TTS providers with GPU memory management"
requires-python = ">=3.11"
dependencies = [
    "soundfile>=0.12.0",
    "librosa>=0.11.0",
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "neucodec>=0.0.4",
    "phonemizer>=3.3.0",
    "transformers>=4.40.0",
    "resemble-perth>=1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts"]

[tool.uv]
package = true

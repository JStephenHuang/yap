[project]
name = "creepypastas"
version = "0.1.0"
description = ""
authors = [
    {name = "J.Stephen",email = "j.stephen.huang.developer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10, <3.12"

[tool.poetry.dependencies]
python-dotenv = ">=1.1.0,<2.0.0"
langchain-community = ">=0.3.23,<0.4.0"
langchain-core = ">=0.3.56,<0.4.0"
langgraph = ">=0.4.0,<0.5.0"
langchain-ollama = ">=0.3.2,<0.4.0"
praw = ">=7.8.1,<8.0.0"
pandas = ">=2.2.3,<3.0.0"
pydantic = ">=2.11.4,<3.0.0"
logging = ">=0.4.9.6,<0.5.0.0"
pydantic-settings = ">=2.9.1,<3.0.0"
ollama = ">=0.4.8,<0.5.0"
coqui-tts = ">=0.27.0,<0.28.0"
diffusers = {git = "https://github.com/huggingface/diffusers.git"}
sentencepiece = "^0.2.0"
torch = {version = "^2.4.0+cu124", source = "pytorch-gpu"}
torchvision = {version = "^0.19.0+cu124", source = "pytorch-gpu"}
torchaudio = {version = "^2.4.0+cu124", source = "pytorch-gpu"}
transformers = "^4.55.2"
accelerate = "^1.10.0"
safetensors = "^0.6.2"
google-genai = "^1.31.0"
pillow = "^11.3.0"
soundfile = "^0.13.1"
nltk = "^3.9.1"

[[tool.poetry.source]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry]
packages = [{include = "creepypastas", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main = "creepypastas.main:main"
test = "tests.sandbox:run"
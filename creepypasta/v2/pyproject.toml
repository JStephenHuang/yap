[project]
name = "v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.2",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "praw>=7.8.1",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "rich>=13.0.0",
    "datasets>=3.0.0",

    "llm",
    "tts",
    "tti",
    
    "torch",
    "torchvision",
    "torchaudio",
]

[project.scripts]
scrape-reddit = "scrape:run"
check-cuda = "check_cuda:check"

[tool.uv]
package = true

[tool.uv.sources]
llm = { path = "../../llm", editable = true }
tts = { path = "../../tts", editable = true }
tti = { path = "../../tti", editable = true }

torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

# ============================================
# CUDA VERSION SELECTION
# Uncomment ONE of the indexes below:
# ============================================

# CUDA 12.6
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


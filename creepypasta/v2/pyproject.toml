[project]
name = "v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0.2",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "praw>=7.8.1",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "rich>=13.0.0",
    "llm",
    "tts",
    "tti",
    "datasets>=3.0.0",
]

[project.optional-dependencies]
cu124 = ["torch", "torchvision", "torchaudio"]
cu126 = ["torch", "torchvision", "torchaudio"]

[project.scripts]
scrape-reddit = "scrape:run"

[tool.uv]
package = true
index-strategy = "unsafe-best-match"

[tool.uv.sources]
llm = { path = "../../llm", editable = true }
tts = { path = "../../tts", editable = true }
tti = { path = "../../tti", editable = true }
torch = [
    { index = "pytorch-cu124", marker = "extra == 'cu124'" },
    { index = "pytorch-cu126", marker = "extra == 'cu126' and extra != 'cu124'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "extra == 'cu124'" },
    { index = "pytorch-cu126", marker = "extra == 'cu126' and extra != 'cu124'" },
]
torchaudio = [
    { index = "pytorch-cu124", marker = "extra == 'cu124'" },
    { index = "pytorch-cu126", marker = "extra == 'cu126' and extra != 'cu124'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

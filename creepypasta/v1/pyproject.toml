[project]
name = "creepypastas"
version = "0.1.0"
description = ""
authors = [
    {name = "J.Stephen",email = "j.stephen.huang.developer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10, <3.12"

[tool.poetry.dependencies]
python-dotenv = ">=1.1.0,<2.0.0"
praw = ">=7.8.1,<8.0.0"
pandas = ">=2.2.3,<3.0.0"
pydantic = ">=2.11.4,<3.0.0"
logging = ">=0.4.9.6,<0.5.0.0"
pydantic-settings = ">=2.9.1,<3.0.0"
ollama = ">=0.4.8,<0.5.0"
sentencepiece = "^0.2.0"

diffusers = { git = "https://github.com/huggingface/diffusers.git" }

torch = ">=2.4,<3.0"
torchvision = ">=0.19,<1.0"
torchaudio = ">=2.4,<3.0"

transformers = ">=4.45.1,<4.47.0"
accelerate = "^1.10.0"
safetensors = "^0.6.2"
pillow = "^11.3.0"
soundfile = "^0.13.1"
nltk = "^3.9.1"
ffmpeg-python = "^0.2.0"

google-genai = "^1.31.0"
google-api-python-client = "^2.179.0"
google-auth-oauthlib = "^1.2.2"

typer = "^0.16.1"
pydub = "^0.25.1"
loguru = "^0.7.3"
jieba = "^0.42.1"
langid = "^1.1.6"
ruff = "0.12.2"
vector-quantize-pytorch = "^1.23.2"
json-repair = "^0.50.0"
s3fs = "^2025.7.0"
boto3 = "1.35.36"
dacite = "^1.9.2"
descript-audio-codec = "^1.0.0"
omegaconf = "^2.3.0"

[tool.poetry.group.cuda]
optional = true

[tool.poetry.group.cuda.dependencies]
torch = { version = "^2.4.0+cu124", source = "pytorch-cu124" }
torchvision = { version = "^0.19.0+cu124", source = "pytorch-cu124" }
torchaudio = { version = "^2.4.0+cu124", source = "pytorch-cu124" }

[[tool.poetry.source]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
priority = "explicit"


[[tool.poetry.source]]
name = "boson-ai"
url = "https://github.com/boson-ai/higgs-audio"
priority = "explicit"

[tool.poetry]
packages = [{include = "creepypastas", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main = "creepypastas.main:main"
test = "tests.sandbox:run"